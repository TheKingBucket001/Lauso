name: Android CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager 'platforms;android-37.0' 'build-tools;35.0.0'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build and lint non-release change
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: ./gradlew :app:assembleDebug :app:lintDebug --no-daemon

      - name: Restore formal release signing configuration
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${RELEASE_KEYSTORE_BASE64:?RELEASE_KEYSTORE_BASE64 is required}"
          : "${RELEASE_STORE_PASSWORD:?RELEASE_STORE_PASSWORD is required}"
          : "${RELEASE_KEY_ALIAS:?RELEASE_KEY_ALIAS is required}"
          : "${RELEASE_KEY_PASSWORD:?RELEASE_KEY_PASSWORD is required}"
          mkdir -p .local
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > .local/lauso-release.keystore
          test -s .local/lauso-release.keystore
          echo "RELEASE_STORE_FILE=$GITHUB_WORKSPACE/.local/lauso-release.keystore" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build and lint formal release
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew :app:checkReleaseSigning :app:assembleRelease :app:lintRelease --no-daemon

      - name: Verify formal APK signature and metadata
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$apk"
          test -x "$build_tools/apksigner"
          test -x "$build_tools/aapt"
          certs=$("$build_tools/apksigner" verify --verbose --print-certs "$apk" 2>&1)
          printf '%s\n' "$certs"
          if printf '%s\n' "$certs" | grep -q 'Android Debug'; then
            echo 'Release APK is debug-signed.' >&2
            exit 1
          fi
          "$build_tools/aapt" dump badging "$apk" | grep -F "package: name='dev.bucket.launcherslogan'"
          "$build_tools/aapt" dump badging "$apk" | grep -F "versionName='0.6.3'"

      - name: Rename release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/LauSo-${{ github.ref_name }}.apk

      - name: Upload release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: LauSo-${{ github.ref_name }}
          path: app/build/outputs/apk/release/LauSo-${{ github.ref_name }}.apk
          if-no-files-found: error

  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release APK
        uses: actions/download-artifact@v4
        with:
          name: LauSo-${{ github.ref_name }}
          path: release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: LauSo ${{ github.ref_name }}
          body: |
            ## 改进

            - 优化菜单行按压反馈颜色，使用更容易辨认的淡蓝色按压方块，保持空闲状态透明。
            - 修复议题 [#1](https://github.com/TheKingBucket001/Lauso/issues/1)：修正 ColorOS Launcher 长按菜单半透明背景中不完整的矩形白底。
            - 修复半透明菜单开闭动画阴影过重的问题，移除内层面板与结构容器的重复阴影。
            - 保留菜单行按压反馈边界，并在菜单关闭后恢复原生材质状态。
            - 修复重复规则导致管理页崩溃的问题。
            - 优化 Launcher 回执等待、Root 命令和页面生命周期，减少环境检测误判与旧页面回调。
            - 提升菜单 Hook 兼容性：可选 Hook 独立降级，关闭菜单后清理材质缓存。
            - 修正无标语菜单的 divider 与按压反馈边界，并完善发布同步链路。
          files: release/LauSo-${{ github.ref_name }}.apk

  sync-lsposed-repository:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Configure LSPosed repository key
        env:
          LSPOSED_SYNC_SSH_KEY: ${{ secrets.LSPOSED_SYNC_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${LSPOSED_SYNC_SSH_KEY:?LSPOSED_SYNC_SSH_KEY is required}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$LSPOSED_SYNC_SSH_KEY" > ~/.ssh/lsposed-sync
          chmod 600 ~/.ssh/lsposed-sync
          ssh-keygen -y -f ~/.ssh/lsposed-sync > ~/.ssh/lsposed-sync.pub
          chmod 644 ~/.ssh/lsposed-sync.pub
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts
          printf 'Host github.com\n  IdentityFile ~/.ssh/lsposed-sync\n  IdentitiesOnly yes\n' >> ~/.ssh/config
          {
            echo "LSPOSED_SYNC_SIGNING_KEY=$HOME/.ssh/lsposed-sync.pub"
            echo "LSPOSED_SYNC_GPG_SSH_PROGRAM=ssh-keygen"
          } >> "$GITHUB_ENV"

      - name: Synchronize LSPosed module repository
        env:
          LSPOSED_REPOSITORY_SSH_URL: git@github.com:Xposed-Modules-Repo/dev.bucket.launcherslogan.git
          LSPOSED_SOURCE_URL: https://github.com/TheKingBucket001/Lauso
          LSPOSED_DISPLAY_TITLE: LauSo-为 ColorOS Launcher 图标长按菜单添加自定义标语
        run: node scripts/sync-lsposed-repository.mjs
