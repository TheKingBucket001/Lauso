name: Android CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-37.0' 'build-tools;35.0.0'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build and lint non-release change
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: ./gradlew :app:assembleDebug :app:lintDebug --no-daemon

      - name: Restore formal release signing configuration
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${RELEASE_KEYSTORE_BASE64:?RELEASE_KEYSTORE_BASE64 is required}"
          : "${RELEASE_STORE_PASSWORD:?RELEASE_STORE_PASSWORD is required}"
          : "${RELEASE_KEY_ALIAS:?RELEASE_KEY_ALIAS is required}"
          : "${RELEASE_KEY_PASSWORD:?RELEASE_KEY_PASSWORD is required}"
          mkdir -p .local
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > .local/lauso-release.keystore
          test -s .local/lauso-release.keystore
          echo "RELEASE_STORE_FILE=$GITHUB_WORKSPACE/.local/lauso-release.keystore" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build and lint formal release
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew :app:checkReleaseSigning :app:assembleRelease :app:lintRelease --no-daemon

      - name: Verify formal APK signature and metadata
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$apk"
          test -x "$build_tools/apksigner"
          test -x "$build_tools/aapt"
          certs=$("$build_tools/apksigner" verify --verbose --print-certs "$apk" 2>&1)
          printf '%s\n' "$certs"
          if printf '%s\n' "$certs" | grep -q 'Android Debug'; then
            echo 'Release APK is debug-signed.' >&2
            exit 1
          fi
          "$build_tools/aapt" dump badging "$apk" | grep -F "package: name='dev.bucket.launcherslogan'"
          "$build_tools/aapt" dump badging "$apk" | grep -F "versionName='0.5'"

      - name: Upload release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: LauSo-${{ github.ref_name }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: LauSo ${{ github.ref_name }}
          files: app/build/outputs/apk/release/app-release.apk
