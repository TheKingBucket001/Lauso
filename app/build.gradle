plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

import java.util.Properties

// Release credentials are supplied by the environment in CI or by the ignored
// local.properties file. No keystore or signing.properties belongs in the repo.
def localSigningProperties = new Properties()
def localSigningFile = rootProject.file('local.properties')
if (localSigningFile.isFile()) {
    localSigningFile.withInputStream { localSigningProperties.load(it) }
}
def signingSecret = { String name ->
    def environmentValue = System.getenv(name)
    if (environmentValue != null && !environmentValue.trim().isEmpty()) {
        return environmentValue.trim()
    }
    def localValue = localSigningProperties.getProperty(name)
    return localValue == null ? null : localValue.trim()
}
def releaseStoreFilePath = signingSecret('RELEASE_STORE_FILE')
def releaseStorePassword = signingSecret('RELEASE_STORE_PASSWORD')
def releaseKeyAlias = signingSecret('RELEASE_KEY_ALIAS')
def releaseKeyPassword = signingSecret('RELEASE_KEY_PASSWORD')
def releaseStoreFile = releaseStoreFilePath == null ? null : rootProject.file(releaseStoreFilePath)
def hasReleaseSigning = releaseStoreFile != null
        && releaseStoreFile.isFile()
        && releaseStorePassword != null
        && !releaseStorePassword.isEmpty()
        && releaseKeyAlias != null
        && !releaseKeyAlias.isEmpty()
        && releaseKeyPassword != null
        && !releaseKeyPassword.isEmpty()

// Framework classes remain invisible to UI compilation and are never packaged in the APK.
def xposedR8LibraryDir = layout.buildDirectory.dir('generated/r8-xposed')
def prepareXposedR8Library = tasks.register('prepareXposedR8Library') {
    def apiArchive = rootProject.file('local-libs/libxposed-api-102.0.0.aar')
    inputs.file(apiArchive)
    outputs.dir(xposedR8LibraryDir)
    doLast {
        def output = xposedR8LibraryDir.get().asFile
        copy {
            from zipTree(apiArchive)
            include 'classes.jar'
            into output
        }
        def library = new File(output, 'classes.jar').absolutePath.replace('\\', '/')
        new File(output, 'framework.pro').setText("-libraryjars '${library}'\n", 'UTF-8')
    }
}

android {
    namespace 'dev.bucket.launcherslogan'
    compileSdk 37

    defaultConfig {
        applicationId 'dev.bucket.launcherslogan'
        minSdk 26
        targetSdk 36
        versionCode 11
        versionName '0.7.0'
    }

    signingConfigs {
        if (hasReleaseSigning) {
            create('release') {
                storeFile releaseStoreFile
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing false
                enableV2Signing true
                enableV3Signing true
                enableV4Signing false
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            proguardFile xposedR8LibraryDir.get().file('framework.pro').asFile
            if (hasReleaseSigning) {
                signingConfig signingConfigs.getByName('release')
            }
        }
    }

    packaging {
        resources {
            merges += ['META-INF/xposed/**']
            excludes += ['kotlin/**', 'META-INF/com/android/build/**', 'META-INF/version-control-info.textproto', 'DebugProbesKt.bin']
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.configureEach {
    if ((name.startsWith('minify') && name.endsWith('WithR8')) || name.toLowerCase().contains('lint')) {
        dependsOn(prepareXposedR8Library)
    }
    if (name in ['assembleRelease', 'bundleRelease', 'packageRelease', 'packageReleaseBundle']) {
        dependsOn('checkReleaseSigning')
    }
}

tasks.register('checkReleaseSigning') {
    group = 'signing'
    description = 'Verifies that a formal release keystore is configured.'
    doLast {
        if (!hasReleaseSigning) {
            throw new GradleException(
                    'Formal release signing is not configured. Set RELEASE_STORE_FILE, '
                            + 'RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS and RELEASE_KEY_PASSWORD.'
            )
        }
    }
}

tasks.register('signRelease') {
    group = 'signing'
    description = 'Builds the release APK with the configured formal signing key.'
    dependsOn('checkReleaseSigning')
    dependsOn('assembleRelease')
}

dependencies {
    implementation project(':shared')
    runtimeOnly project(':hook')
    implementation 'androidx.activity:activity-compose:1.12.4'
    implementation 'androidx.compose.animation:animation:1.11.2'
    implementation 'androidx.emoji2:emoji2:1.4.0'
    implementation 'androidx.startup:startup-runtime:1.1.1'
    implementation 'top.yukonga.miuix.kmp:miuix-ui:0.9.4'
}
