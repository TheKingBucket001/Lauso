plugins {
    id 'com.android.library'
}

android {
    namespace 'dev.bucket.launcherslogan.shared'
    compileSdk 37
    enableKotlin = false
    androidResources.enable = false

    defaultConfig {
        minSdk 26
    }

    buildFeatures {
        buildConfig false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
