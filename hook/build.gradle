plugins {
    id 'com.android.library'
}

android {
    namespace 'dev.bucket.launcherslogan.hook'
    compileSdk 37
    enableKotlin = false
    androidResources.enable = false

    defaultConfig {
        minSdk 26
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildFeatures {
        buildConfig false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':shared')
    compileOnly files('../local-libs/libxposed-api-102.0.0.aar')
}
